<html>
    <head th:replace="~{fragments/base :: head}">
        <title>CLARIN Tool Portal</title> 
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    </head>

    <body>
        <main class="p-3">
            <div th:fragment="links(record)" id="recordLinks" th:object="${record}">
                <table class="table">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Type</th>
                            <th scope="col">Link</th>
                            <th scope="col">Media type</th>
                        </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="resource : *{landingPages}">
                        <tr th:fragment="linkRow(resource)" th:object="${resource}">
                            <td th:text="*{type}">type</td>
                            <td>
                                <a th:href="*{ref}" th:text="*{ref}">[Link]</a>
                            </td>
                            <td th:text="*{mediaType}">mediaType</td>
                        </tr>
                    </th:block> 
                    <th:block th:each="resource : *{resources}">
                        <tr th:replace="~{this :: linkRow(${resource})}"></tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
